<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Small Happy Corner</title>
  <meta name="description" content="A small page to make your day a bit lighter." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="tiny-text">For whoever scanned this</p>

      <h1>A small happy corner</h1>

      <p id="message" class="message">
        Take a breath. You do not need to solve everything today.
      </p>

      <div class="image-frame">
        <img
          id="main-image"
          src="images/photo1.jpg"
          alt="A calm uplifting image"
        />
      </div>

      <button id="new-btn" type="button">Another one</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
