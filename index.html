<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>it's okay</title>
  <meta name="description" content="A small page to make your day a bit lighter." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="tiny-text">For whoever scanned this</p>

      <h2>Just a reminder that there is still a lot to look forward to.</h2>

      <div class="image-frame">
        <img
          id="main-image"
          src="images/photo0.jpg"
          alt="A calm uplifting image"
        />
      </div>

      <p id="message" class="message">
        "Remember to look up at the stars and not down at your feet." - Stephen Hawking
      </p>

      <button id="new-btn" type="button">Another one</button>

      <p class="tiny-text">
        Come back whenever you want,<br>
        new image every 8 hours
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
